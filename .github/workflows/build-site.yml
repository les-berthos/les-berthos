name: Reconstruire le site on: push: branches: [main] paths: - "data/**" - "scripts/**" workflow_dispatch: {} permissions: contents: write jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.11" - name: Installer les dépendances run: pip install -r scripts/requirements.txt - name: Générer le site (dossier docs/) run: python3 scripts/generate_site.py - name: Publier le site mis à jour run: | git config user.name "github-actions" git config user.email "github-actions@github.com" git add docs git diff --cached --quiet && echo "Rien à publier" || git commit -m "Mise à jour automatique du site" git push
